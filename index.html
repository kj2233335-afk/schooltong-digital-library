<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <style>
    /* 색상: 주색 군청 #1E3F82, 부족재고 주황 #E67E22 */
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; font-size: 17px; line-height: 1.45; color: #1f2937; background: #f2f4f8; }

    /* 상단 제목 */
    header { display: flex; align-items: center; gap: 12px; background: #1E3F82; color: #fff; padding: 12px 16px; font-size: 21px; font-weight: bold; letter-spacing: -0.01em; }
    header .logo { flex: none; display: flex; align-items: center; height: 44px; padding: 4px 10px; background: #fff; border-radius: 8px; }
    header .logo img { display: block; height: 100%; width: auto; }
    header .title { flex: 1; min-width: 0; }
    header #itemType { font-weight: normal; font-size: 15px; opacity: .85; margin-left: 4px; }

    /* 탭 */
    nav { display: flex; background: #fff; border-bottom: 1px solid #d9deea; position: sticky; top: 0; z-index: 10; }
    nav button { flex: 1; min-height: 54px; padding: 0; border: 0; background: none; font-family: inherit; font-size: 16px; font-weight: 600; color: #5b6478; border-bottom: 4px solid transparent; cursor: pointer; }
    nav button.on { color: #1E3F82; border-bottom-color: #1E3F82; font-weight: bold; }
    nav button:active { background: #eef2f9; }

    section { display: none; padding: 18px 16px 28px; max-width: 640px; margin: 0 auto; }
    section.on { display: block; }

    /* 입력 */
    label { display: block; margin: 16px 0 6px; font-size: 15px; font-weight: 600; color: #3b4a6b; }
    input, select, textarea { width: 100%; min-height: 52px; padding: 12px 14px; border: 1.5px solid #c5cbd8; border-radius: 10px; font-family: inherit; font-size: 18px; color: #1f2937; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #1E3F82; box-shadow: 0 0 0 3px rgba(30,63,130,.18); }
    input::placeholder { color: #a0a7b8; }
    .row2 { display: flex; gap: 12px; }
    .row2 > div { flex: 1; }

    /* 입고/출고 선택 */
    .typebox { display: flex; gap: 10px; }
    .typebox button { flex: 1; min-height: 58px; padding: 0; border: 2px solid #c5cbd8; border-radius: 10px; background: #fff; font-family: inherit; font-size: 19px; font-weight: 600; color: #5b6478; cursor: pointer; }
    .typebox button.in.sel { border-color: #188038; background: #e6f4ea; color: #188038; font-weight: bold; }
    .typebox button.out.sel { border-color: #d93025; background: #fce8e6; color: #d93025; font-weight: bold; }

    /* 버튼 */
    .btn { width: 100%; min-height: 58px; margin-top: 22px; padding: 12px; border: 0; border-radius: 10px; background: #1E3F82; color: #fff; font-family: inherit; font-size: 19px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 6px rgba(30,63,130,.25); }
    .btn:active { background: #172f61; }
    .btn:disabled { background: #97a6c7; box-shadow: none; }
    .btn.sub { background: #fff; color: #1E3F82; border: 2px solid #1E3F82; margin-top: 14px; min-height: 54px; box-shadow: none; }
    .btn.sub:active { background: #eef2f9; }

    /* 결과 메시지 */
    .msg { margin-top: 14px; padding: 13px 14px; border-radius: 10px; font-size: 16px; font-weight: 600; display: none; }
    .msg.ok { display: block; background: #e6f4ea; color: #188038; }
    .msg.err { display: block; background: #fce8e6; color: #d93025; }

    /* 표 */
    .wrap { overflow-x: auto; background: #fff; border: 1px solid #d9deea; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 16px; }
    th, td { padding: 13px 10px; border-bottom: 1px solid #edf0f5; text-align: left; white-space: nowrap; }
    th { background: #eef2f9; color: #1E3F82; font-weight: bold; font-size: 15px; }
    tr:last-child td { border-bottom: 0; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.low td { background: #fff3e6; }
    tr.low td:first-child { box-shadow: inset 4px 0 0 #E67E22; }

    /* 태그 */
    .tag { display: inline-block; padding: 3px 9px; border-radius: 6px; font-size: 14px; font-weight: bold; line-height: 1.3; }
    .tag.low { background: #E67E22; color: #fff; }
    .tag.in { background: #e6f4ea; color: #188038; }
    .tag.out { background: #fce8e6; color: #d93025; }

    .stockinfo { margin-top: 8px; font-size: 16px; color: #1E3F82; font-weight: 600; }
    .search { margin-bottom: 12px; }
    .small { font-size: 15px; color: #6b7280; margin-top: 10px; }
    .small::before { content: ""; display: inline-block; width: 14px; height: 14px; background: #E67E22; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  </style>
</head>

    <div class="title">메가플러스 재고관리 <span id="itemType"></span></div>
  </header>
  <nav>
    <button class="on" data-tab="tx">입출고</button>
    <button data-tab="stock">재고현황</button>
    <button data-tab="hist">이력</button>
    <button data-tab="add">품목추가</button>
  </nav>

  <!-- 입출고 등록 -->
  <section id="tx" class="on">
    <label>구분</label>
    <div class="typebox" id="typebox"></div>

    <label>품목</label>
    <select id="txCode"></select>
    <div class="stockinfo" id="stockinfo"></div>

    <div class="row2">
      <div><label>수량</label><input type="number" id="txQty" min="1" inputmode="numeric"></div>
      <div><label>담당자</label><input type="text" id="txPerson"></div>
    </div>
    <label>메모</label>
    <input type="text" id="txMemo" placeholder="선택 입력">
    <button class="btn" id="txBtn" onclick="submitTx()">등록</button>
    <div class="msg" id="txMsg"></div>
  </section>

  <!-- 재고 현황 -->
  <section id="stock">
    <input class="search" type="text" id="stockSearch" placeholder="품목명/코드 검색" oninput="renderStock()">
    <div class="wrap">
      <table>
        <thead><tr><th>코드</th><th>품목명</th><th>단위</th><th style="text-align:right">현재</th><th style="text-align:right">안전</th><th></th></tr></thead>
        <tbody id="stockBody"></tbody>
      </table>
    </div>
    <div class="small">주황색 줄 = 안전재고 이하</div>
    <button class="btn sub" onclick="reload()">새로고침</button>
  </section>

  <!-- 이력 -->
  <section id="hist">
    <div class="wrap">
      <table>
        <thead><tr><th>일시</th><th>품목</th><th>구분</th><th style="text-align:right">수량</th><th>담당</th><th>메모</th></tr></thead>
        <tbody id="histBody"></tbody>
      </table>
    </div>
    <button class="btn sub" onclick="reload()">새로고침</button>
  </section>

  <!-- 품목 추가 -->
  <section id="add">
    <div class="row2">
      <div><label>품목코드</label><input type="text" id="adCode"></div>
      <div><label>단위</label><select id="adUnit"></select></div>
    </div>
    <label>품목명</label>
    <input type="text" id="adName" placeholder="예) A4 80g 복사용지">
    <div class="row2">
      <div><label>초기재고</label><input type="number" id="adStock" value="0" min="0"></div>
      <div><label>안전재고</label><input type="number" id="adSafe" value="0" min="0"></div>
    </div>
    <label>비고</label>
    <input type="text" id="adMemo">
    <button class="btn" id="adBtn" onclick="submitAdd()">품목 추가</button>
    <div class="msg" id="adMsg"></div>
  </section>

  <script>
    var S = { settings: null, items: [], history: [], type: '' };

    // 탭 전환
    document.querySelectorAll('nav button').forEach(function (b) {
      b.onclick = function () {
        document.querySelectorAll('nav button').forEach(function (x) { x.classList.remove('on'); });
        document.querySelectorAll('section').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        document.getElementById(b.dataset.tab).classList.add('on');
        if (b.dataset.tab === 'add') fillNextCode();
      };
    });

    function reload() {
      google.script.run.withSuccessHandler(boot).withFailureHandler(function (e) { alert(e.message); }).getBootstrap();
    }

    function boot(d) {
      S.settings = d.settings; S.items = d.items; S.history = d.history;
      document.getElementById('itemType').textContent = d.settings.itemType ? '· ' + d.settings.itemType : '';
      renderTypes(); renderCodes(); renderUnits(); renderStock(); renderHist();
      var saved = localStorage.getItem('person'); if (saved) document.getElementById('txPerson').value = saved;
    }

    function renderTypes() {
      var box = document.getElementById('typebox'); box.innerHTML = '';
      S.settings.types.forEach(function (t, i) {
        var b = document.createElement('button');
        b.textContent = t; b.className = (t === '출고' ? 'out' : 'in');
        b.onclick = function () { selType(t); };
        box.appendChild(b);
        if (i === 0) selType(t);
      });
    }
    function selType(t) {
      S.type = t;
      document.querySelectorAll('#typebox button').forEach(function (b) { b.classList.toggle('sel', b.textContent === t); });
    }

    function renderCodes() {
      var sel = document.getElementById('txCode'); var cur = sel.value; sel.innerHTML = '';
      S.items.forEach(function (it) {
        var o = document.createElement('option');
        o.value = it.code; o.textContent = it.code + ' · ' + it.name;
        sel.appendChild(o);
      });
      if (cur) sel.value = cur;
      sel.onchange = showStock; showStock();
    }
    function showStock() {
      var code = document.getElementById('txCode').value;
      var it = S.items.filter(function (x) { return x.code === code; })[0];
      document.getElementById('stockinfo').textContent = it ? '현재재고 ' + it.stock + ' ' + it.unit + ' (안전재고 ' + it.safe + ')' : '';
    }

    function renderUnits() {
      var sel = document.getElementById('adUnit'); sel.innerHTML = '';
      S.settings.units.forEach(function (u) { var o = document.createElement('option'); o.value = u; o.textContent = u; sel.appendChild(o); });
    }

    function renderStock() {
      var q = document.getElementById('stockSearch').value.trim().toLowerCase();
      var tb = document.getElementById('stockBody'); tb.innerHTML = '';
      S.items.forEach(function (it) {
        if (q && (it.code + it.name).toLowerCase().indexOf(q) < 0) return;
        var tr = document.createElement('tr'); if (it.low) tr.className = 'low';
        tr.innerHTML = '<td>' + esc(it.code) + '</td><td>' + esc(it.name) + '</td><td>' + esc(it.unit) + '</td>'
          + '<td class="num">' + it.stock + '</td><td class="num">' + it.safe + '</td>'
          + '<td>' + (it.low ? '<span class="tag low">부족</span>' : '') + '</td>';
        tb.appendChild(tr);
      });
    }

    function renderHist() {
      var tb = document.getElementById('histBody'); tb.innerHTML = '';
      var names = {}; S.items.forEach(function (it) { names[it.code] = it.name; });
      S.history.forEach(function (h) {
        var tr = document.createElement('tr');
        tr.innerHTML = '<td>' + esc(h.time) + '</td><td>' + esc(names[h.code] || h.code) + '</td>'
          + '<td><span class="tag ' + (h.type === '출고' ? 'out' : 'in') + '">' + esc(h.type) + '</span></td>'
          + '<td class="num">' + h.qty + '</td><td>' + esc(h.person) + '</td><td>' + esc(h.memo) + '</td>';
        tb.appendChild(tr);
      });
    }

    function submitTx() {
      var data = {
        code: document.getElementById('txCode').value,
        type: S.type,
        qty: document.getElementById('txQty').value,
        person: document.getElementById('txPerson').value.trim(),
        memo: document.getElementById('txMemo').value.trim()
      };
      var btn = document.getElementById('txBtn'); btn.disabled = true; msg('txMsg', '', '');
      google.script.run
        .withSuccessHandler(function (r) {
          btn.disabled = false;
          localStorage.setItem('person', data.person);
          msg('txMsg', 'ok', data.type + ' 완료 · 현재재고 ' + r.stock);
          document.getElementById('txQty').value = ''; document.getElementById('txMemo').value = '';
          reload();
        })
        .withFailureHandler(function (e) { btn.disabled = false; msg('txMsg', 'err', e.message); })
        .recordTransaction(data);
    }

    function fillNextCode() {
      if (document.getElementById('adCode').value) return;
      google.script.run.withSuccessHandler(function (c) { document.getElementById('adCode').value = c; }).suggestNextCode();
    }

    function submitAdd() {
      var data = {
        code: document.getElementById('adCode').value.trim(),
        name: document.getElementById('adName').value.trim(),
        unit: document.getElementById('adUnit').value,
        stock: document.getElementById('adStock').value,
        safe: document.getElementById('adSafe').value,
        memo: document.getElementById('adMemo').value.trim()
      };
      var btn = document.getElementById('adBtn'); btn.disabled = true; msg('adMsg', '', '');
      google.script.run
        .withSuccessHandler(function (r) {
          btn.disabled = false; msg('adMsg', 'ok', r.code + ' 추가 완료');
          ['adCode', 'adName', 'adMemo'].forEach(function (id) { document.getElementById(id).value = ''; });
          document.getElementById('adStock').value = 0; document.getElementById('adSafe').value = 0;
          reload();
        })
        .withFailureHandler(function (e) { btn.disabled = false; msg('adMsg', 'err', e.message); })
        .addItem(data);
    }

    function msg(id, cls, text) { var el = document.getElementById(id); el.className = 'msg ' + cls; el.textContent = text; }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

    reload();
  </script>
</body>
</html>
